name = "mybus-route"
main = "src/index.ts"
compatibility_date = "2026-11-01"
# 서비스 주소: https://mybus-route.copark-ai.workers.dev
workers_dev = true
preview_urls = false

# 웹 화면(web/dist)과 API 를 한 Worker 로 제공한다 (ADR-020).
# /api/* 만 Worker 코드가 처리하고, 나머지는 정적 파일로 응답한다.
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 사용량 기록 (ADR-032): API 요청마다 한 줄 로그. 대시보드 Workers → mybus-route → Logs 에서 본다 (무료 하루 20만 건, 3일 보관)
[observability]
enabled = true

# 요청 주소(주소 검색어 등)가 기록되지 않도록 자동 요청 기록은 끄고, 코드가 남기는 한 줄 로그만 보관한다 (ADR-033)
[observability.logs]
invocation_logs = false

# 비밀값은 여기 적지 말고 아래 명령으로 등록한다 (로컬은 .dev.vars):
#   npx wrangler secret put BUS_API_KEY
#   npx wrangler secret put NCP_KEY_ID
#   npx wrangler secret put NCP_KEY
