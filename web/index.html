<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <title>mybus-route</title>
  </head>
  <body>
    <div id="map"></div>
    <section id="panel">
      <form id="search" autocomplete="off">
        <div class="field">
          <span class="tag tag-from">출발</span>
          <input id="from" placeholder="정류장 이름·번호 또는 주소" enterkeyhint="next" />
          <button type="button" class="clear" data-clear="from" aria-label="출발지 지우기">×</button>
          <ul class="suggest" id="from-suggest" hidden></ul>
        </div>
        <div class="field">
          <span class="tag tag-to">도착</span>
          <input id="to" placeholder="정류장 이름·번호 또는 주소" enterkeyhint="search" />
          <button type="button" class="clear" data-clear="to" aria-label="도착지 지우기">×</button>
          <ul class="suggest" id="to-suggest" hidden></ul>
        </div>
        <div class="row">
          <div class="seg" role="radiogroup" aria-label="검색 방식">
            <button type="button" data-mode="transfer" aria-pressed="true">환승 포함</button>
            <button type="button" data-mode="direct" aria-pressed="false">직행만</button>
          </div>
          <button type="button" id="swap" class="icon-btn" aria-label="출발지와 도착지 바꾸기">⇅</button>
          <button type="button" id="refresh" class="icon-btn" aria-label="새로고침">↻</button>
        </div>
      </form>
      <div id="status"></div>
      <ul id="results"></ul>
      <section id="board"></section>
      <section id="favorites"></section>
      <section id="pairs"></section>
      <footer id="footer"></footer>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
