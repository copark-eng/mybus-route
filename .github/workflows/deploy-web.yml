# web/ 을 빌드해서 GitHub Pages 에 배포한다 (ADR-003).
# 저장소 Settings > Pages > Source 를 "GitHub Actions" 로 설정하고,
# Settings > Secrets and variables > Actions > Variables 에
#   VITE_NAVER_MAP_CLIENT_ID, VITE_API_BASE 를 등록한다.
name: Deploy web

on:
  push:
    branches: [main]
    paths: ["web/**", "package*.json", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w web
        env:
          VITE_NAVER_MAP_CLIENT_ID: ${{ vars.VITE_NAVER_MAP_CLIENT_ID }}
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
